<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HJ10 仓库维护 agent · 测试门户</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>HJ10 仓库维护 agent · 测试门户</h1>
    <span class="hint">本机调试工具 · 仅限 127.0.0.1</span>
  </header>

  <main>
    <section class="panel config">
      <h2>配置</h2>

      <label>测试样例
        <select id="task"></select>
      </label>
      <p id="task-notes" class="notes"></p>

      <label>策略
        <select id="policy"></select>
      </label>

      <label>模型 <span class="muted">(llm 策略)</span>
        <input id="model" type="text" placeholder="留空则用 .env 的 LLM_MODEL">
      </label>

      <fieldset>
        <legend>工具</legend>
        <div id="tools"></div>
      </fieldset>

      <details>
        <summary>进阶</summary>
        <label>max steps <input id="max-steps" type="number" min="1" value="30"></label>
        <label>budget USD <input id="budget" type="number" min="0" step="0.01" placeholder="可选"></label>
      </details>

      <div class="preflight">
        <button id="preflight-btn" type="button">运行 preflight</button>
        <ul id="preflight-list"></ul>
      </div>

      <div class="actions">
        <button id="start" type="button" class="primary">开始</button>
        <button id="cancel" type="button" disabled>取消</button>
      </div>
      <p id="error" class="error"></p>
    </section>

    <section class="panel results">
      <h2>运行结果</h2>
      <div id="status-bar" class="status-bar"></div>

      <div class="columns">
        <div>
          <h3>步骤</h3>
          <ol id="steps" class="steps"></ol>
        </div>
        <div>
          <h3>日志</h3>
          <pre id="log" class="log"></pre>
        </div>
      </div>

      <div id="result-summary"></div>
      <iframe id="report" title="report" hidden></iframe>

      <h3>历史 run</h3>
      <table id="history">
        <thead><tr><th>时间</th><th>task</th><th>policy</th><th>prompt</th><th>工具</th><th>tools 版本</th><th>status</th><th>resolved</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
